name: Publish GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static frontend
        run: |
          mkdir _site
          cp index.html script.js voting.js storage.js loading.js style.css live.css live-integration.js config.js client.js committees.js supervisor.html supervisor.js supervisor.css dev.html dev.js admin-auth.js presence-state.js _site/
          cp -r assets _site/
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.GITHUB_SHA;
          for (const name of readdirSync('_site')) {
            if (!/\.(js|html)$/.test(name)) continue;
            let source = readFileSync('_site/' + name, 'utf8');
            if (name.endsWith('.js')) source = source.replace(/from '(\.\/[^'?]+\.js)(?:\?[^']*)?'/g, (_, file) => `from '${file}?v=${version}'`);
            else source = source.replace(/(src|href)="([^"?]+\.(?:js|css))(?:\?[^" ]*)?"/g, (_, attribute, file) => `${attribute}="${file}?v=${version}"`);
            writeFileSync('_site/' + name, source);
          }
          NODE
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

