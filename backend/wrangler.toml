name = "minionu-api"
main = "src/index.js"
compatibility_date = "2026-10-07"

[[d1_databases]]
binding = "DB"
database_name = "minionu"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomLiveUpdates"

[[durable_objects.bindings]]
name = "DASHBOARD"
class_name = "GlobalDashboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomLiveUpdates"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GlobalDashboard"]

[vars]
ALLOWED_ORIGINS = "https://galaobiel4.github.io,https://codepen.io,https://cdpn.io,http://localhost:5500,http://127.0.0.1:5500"
